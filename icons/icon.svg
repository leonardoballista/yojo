    <path id="p" d="M0 0 C -52 -46 -58 -128 0 -196 C 58 -128 52 -46 0 0 Z"/>
  </defs>
  <rect width="512" height="512" rx="112" fill="#EC8F97"/>
  <g transform="translate(256 362) scale(1.12)" fill="#FFFFFF">
    <use href="#p" transform="rotate(-66) scale(.74)"/>
    <use href="#p" transform="rotate(66) scale(.74)"/>
    <use href="#p" transform="rotate(-34) scale(.9)"/>
    <use href="#p" transform="rotate(34) scale(.9)"/>
    <use href="#p"/>
  </g>
</svg>
